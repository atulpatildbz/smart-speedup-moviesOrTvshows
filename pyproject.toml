[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-speedup"
version = "0.2.0"
description = "Speed up the silent parts of a movie or episode faster than the dialogue"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pysrt"]

[project.optional-dependencies]
gui = ["pywebview>=5"]

[project.scripts]
smart-speedup = "splitspeedconcatV2:main"

[project.gui-scripts]
smart-speedup-gui = "speedup_gui:main"

[tool.setuptools]
py-modules = ["splitspeedconcatV2", "pgsreader"]
packages = ["speedup_gui"]

[tool.setuptools.package-data]
speedup_gui = ["index.html"]
